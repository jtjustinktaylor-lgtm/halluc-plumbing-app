<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#DAA520"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#0d2137"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Shield background -->
  <path d="M100 10 L185 50 L185 110 Q185 170 100 195 Q15 170 15 110 L15 50 Z" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <!-- Inner shield line -->
  <path d="M100 25 L170 58 L170 108 Q170 158 100 180 Q30 158 30 108 L30 58 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5"/>
  <!-- Wrench icon -->
  <g transform="translate(100,85) scale(1.1)" fill="url(#goldGrad)">
    <path d="M-8 -35 L8 -35 L8 -8 L35 -8 L35 8 L8 8 L8 35 L-8 35 L-8 8 L-35 8 L-35 -8 L-8 -8 Z" rx="3"/>
    <circle cx="0" cy="0" r="12" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  </g>
  <!-- H letter -->
  <text x="100" y="148" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="url(#goldGrad)" filter="url(#shadow)">H</text>
  <!-- Stars -->
  <text x="60" y="168" text-anchor="middle" font-size="10" fill="#DAA520">★</text>
  <text x="140" y="168" text-anchor="middle" font-size="10" fill="#DAA520">★</text>
</svg>